<!doctype html><meta charset="utf-8"><title>Agent Monitor</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#2a313c;--fg:#e6e9ef;--mut:#8b95a5;--run:#3ddc97;--idle:#4b5563;--done:#6aa9ff;--msg:#f5b84b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;display:grid;grid-template-columns:1fr 340px;height:100vh;overflow:hidden}
header{position:fixed;top:0;left:0;right:340px;height:50px;padding:0 20px;display:flex;gap:16px;align-items:center;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
h1{font-size:15px;margin:0}#conn{font-size:12px;color:var(--mut)}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:12px}
.legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid var(--run);vertical-align:middle;margin-right:6px}.legend i.m{border-top:2px dashed var(--msg)}.legend i.d{border-top:2px dashed var(--done)}
main{margin-top:50px;height:calc(100vh - 50px);overflow:auto}
#now{padding:12px 20px;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
#now b{font-size:14px}#now span{color:var(--mut)}
#stage{position:relative;border-bottom:1px solid var(--line);min-height:300px}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;width:180px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;transition:border-color .2s,box-shadow .2s,opacity .2s;z-index:1}
.node.sel{outline:2px solid #ffffff55;outline-offset:2px}
.node.running{border-color:var(--run);animation:pulse 1.6s infinite}.node.done{border-color:var(--done)}.node.idle{opacity:.55}
.n{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}.running .dot{background:var(--run)}.done .dot{background:var(--done)}
.s{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:3px}.running .st{color:var(--run)}.done .st{color:var(--done)}
.t{color:var(--mut);font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:17px}
@keyframes pulse{50%{box-shadow:0 0 0 5px #3ddc9711,0 0 22px #3ddc9744}}
path{fill:none;stroke:var(--line);stroke-width:1.5}
#ah-a path{fill:#3ddc97;stroke:none}#ah-m path{fill:#f5b84b;stroke:none}#ah-d path{fill:#6aa9ff;stroke:none}
path.wire{stroke-width:2.2;stroke-dasharray:6 6;animation:dash .6s linear infinite}path.wire.assign{stroke:var(--run)}path.wire.msg{stroke:var(--msg)}path.wire.deliver{stroke:var(--done)}
circle.pkt.assign{fill:var(--run)}circle.pkt.msg{fill:var(--msg)}circle.pkt.deliver{fill:var(--done)}
@keyframes dash{to{stroke-dashoffset:-12}}
.pill{position:absolute;transform:translate(-50%,-50%);font-size:11px;padding:2px 8px;border-radius:99px;background:#0e1116;border:1px solid var(--line);color:var(--mut);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;z-index:2}
.pill.assign{border-color:#3ddc9788;color:#b9f3d8}.pill.deliver{border-color:#6aa9ff88;color:#b6d3ff}.pill.msg{border-color:#f5b84b88;color:var(--msg);background:#1b1608}
/* dashboard */
#dash{padding:18px 20px 40px}#dash h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 0 8px;font-weight:600}
#tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.tile em{display:block;font-style:normal;font-size:11px;color:var(--mut)}.tile b{font-size:22px;font-weight:600}
.tile.run b{color:var(--run)}.tile.msg b{color:var(--msg)}.tile.done b{color:var(--done)}
table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--mut);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #1a2029;vertical-align:middle}tr.row{cursor:pointer}tr.row:hover td{background:#131820}tr.row.sel td{background:#182030}
td.nm{font-weight:600;white-space:nowrap}td.nm i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--idle);margin-right:8px}
tr.running td.nm i{background:var(--run)}tr.done td.nm i{background:var(--done)}
td.tk{color:var(--mut);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.bar{display:inline-block;height:5px;border-radius:3px;background:#3d4757;vertical-align:middle;margin-right:6px}
.tools{color:var(--mut);font-size:11px;white-space:nowrap}
.mx td,.mx th{text-align:center;padding:5px 7px;border:1px solid #1a2029;font-size:11px}.mx th:first-child,.mx td:first-child{text-align:left;white-space:nowrap}.mx td:first-child{color:var(--fg);font-weight:600}
.hint{color:var(--mut);font-size:12px}
aside{border-left:1px solid var(--line);overflow:auto;padding:58px 14px 14px;background:#0b0e13}
aside h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
aside h2 label{text-transform:none;letter-spacing:0;font-weight:400;cursor:pointer}
.f{font-size:12px;padding:6px 0 6px 9px;border-bottom:1px solid #1a2029;border-left:2px solid transparent;word-break:break-word}
.f.assign{border-left-color:var(--run)}.f.msg{border-left-color:var(--msg)}.f.reply{border-left-color:var(--done)}.f.hid{display:none}.f.tool{opacity:.55}
.f b{font-weight:600}.f span{color:var(--mut)}.f q{display:block;color:var(--mut);quotes:none;margin-top:2px}
body.notools .f.tool{display:none}
</style>
<header><h1>Portfolio team — live</h1><span id=conn>connecting…</span>
<div class=legend><span><i></i>task in progress</span><span><i class=m></i>agent ↔ agent</span><span><i class=d></i>delivered</span></div>
<button onclick="fetch('/clear').then(()=>location.reload())">Clear</button></header>
<main id=main>
<div id=now></div>
<div id=stage><svg id=lines><defs>
<marker id=ah-a viewBox="0 0 8 8" refX=7 refY=4 markerWidth=7 markerHeight=7 orient=auto><path d="M0,0 L8,4 L0,8z"/></marker>
<marker id=ah-d viewBox="0 0 8 8" refX=7 refY=4 markerWidth=7 markerHeight=7 orient=auto><path d="M0,0 L8,4 L0,8z"/></marker>
<marker id=ah-m viewBox="0 0 8 8" refX=7 refY=4 markerWidth=7 markerHeight=7 orient=auto-start-reverse><path d="M0,0 L8,4 L0,8z"/></marker></defs><g id=paths></g></svg><div id=labels></div></div>
<section id=dash>
  <div id=tiles></div>
  <div>
    <div><h3>Agents — click a row to focus</h3><table id=tbl></table></div>
    <div><h3 style="margin-top:26px">Who messaged whom (row → column)</h3><div id=mx></div></div>
  </div>
</section>
</main>
<aside><h2>Handoffs <label><input type=checkbox id=tools onchange="document.body.classList.toggle('notools',!this.checked)"> tool activity</label></h2><div id=feed></div></aside>
<script>
document.body.classList.add('notools')
const MAIN='portfolio-manager', ORDER=['design-director','case-study-editor','design-critic','ux-flow-reviewer','content-strategist','research-analyst','motion-designer','accessibility-auditor','frontend-engineer','backend-security-engineer','performance-seo-auditor','portfolio-implementer']
const TAGS={manager:MAIN,design:'design-critic',designdir:'design-director',ux:'ux-flow-reviewer',content:'content-strategist',casestudy:'case-study-editor',research:'research-analyst',motion:'motion-designer',a11y:'accessibility-auditor',frontend:'frontend-engineer',backend:'backend-security-engineer',perf:'performance-seo-auditor',impl:'portfolio-implementer'}
const agents={}, ids={}, wires=[], stage=document.getElementById('stage'), paths=document.getElementById('paths'), labels=document.getElementById('labels'), feed=document.getElementById('feed')
let selected=null, stats, mx, pend, lastAction='', lastT=0
const NS='http://www.w3.org/2000/svg', TTL={assign:7000,msg:7000,deliver:6000}
const CARD_W=180, COL=210, ROW=150, TOP=70
const $=id=>document.getElementById(id)
const short=(s,n)=>s&&s.length>n?s.slice(0,n-1)+'…':(s||'')
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const fmt=ms=>{ms=Math.max(0,Math.round(ms/1000));return Math.floor(ms/60)+':'+String(ms%60).padStart(2,'0')}
const rank=n=>n===MAIN?-1:(ORDER.indexOf(n)<0?99:ORDER.indexOf(n))
function res(x){ // event actor/target (name, id, @tag) -> agent name
  if(!x)return MAIN; x=String(x).replace(/^@/,''); if(x==='main'||x==='team-lead')return MAIN
  return ids[x]||(agents[x]||ORDER.includes(x)||x===MAIN?x:TAGS[x]||x)
}
function resetRun(){ // a new prompt starts a new run: every card goes back to idle, wires and numbers clear
  for(const w of wires)w.rm();wires.length=0
  stats={start:0,assigned:0,asks:0,replies:0,done:false};mx={};pend={};lastAction='';selected=null
  for(const a of Object.values(agents)){Object.assign(a,{state:'idle',task:'',note:'',tip:'',calls:0,sent:0,recv:0,tools:{},start:0,stop:0});paint(a)}
}
function get(name){
  if(agents[name])return agents[name]
  const el=document.createElement('div');el.className='node idle'
  el.innerHTML='<div class=n><span></span><i class=dot></i></div><div class=s><b class=st></b><em class=c></em></div><div class=t></div>'
  el.querySelector('.n span').textContent=name;el.onclick=()=>select(name);stage.appendChild(el)
  const a=agents[name]={el,name,calls:0,state:'idle',task:'',note:'',tip:'',start:0,stop:0,sent:0,recv:0,tools:{}}
  paint(a);return a
}
function paint(a){
  const q=s=>a.el.querySelector(s), label={idle:'Idle',running:'Working',done:'Done'}[a.state]
  a.el.className='node '+a.state+(selected===a.name?' sel':'')
  q('.st').textContent=label;q('.c').textContent=a.calls?a.calls+' calls':''
  q('.t').textContent=a.note||a.task||'';a.el.title=(a.task?a.task+'\n':'')+(a.tip||'')
}
function set(a,state,o={}){a.state=state;Object.assign(a,o);paint(a)}
function sub(){return Object.keys(agents).filter(n=>n!==MAIN).sort((a,b)=>rank(a)-rank(b))}
function layout(){
  const m=get(MAIN),w=stage.clientWidth,cols=Math.max(1,Math.floor((w-20)/COL)),names=sub()
  m.el.style.left=(w/2-CARD_W/2)+'px';m.el.style.top='20px'
  names.forEach((n,i)=>{const s=agents[n].el;s.style.left=(20+(i%cols)*COL)+'px';s.style.top=(TOP+60+Math.floor(i/cols)*ROW)+'px'})
  stage.style.height=(TOP+60+Math.max(1,Math.ceil(names.length/cols))*ROW+120)+'px'
  agents[MAIN]._cols=cols;drawEdges()
}
function box(n){const el=agents[n].el;return{x:el.offsetLeft,y:el.offsetTop,w:el.offsetWidth,h:el.offsetHeight}}
const bez=(p,t)=>{const u=1-t;return[0,1].map(i=>u*u*u*p[0][i]+3*u*u*t*p[1][i]+3*u*t*t*p[2][i]+t*t*t*p[3][i])}
function wire(kind,from,to,label,tip,open=false){ // a short-lived line: it exists only while the hand-off is happening
  const el=document.createElementNS(NS,'path'),dot=document.createElementNS(NS,'circle'),mo=document.createElementNS(NS,'animateMotion'),pill=document.createElement('div')
  dot.setAttribute('r',4.5);dot.setAttribute('class','pkt '+kind);mo.setAttribute('dur','1.1s');mo.setAttribute('repeatCount','indefinite');dot.appendChild(mo)
  paths.appendChild(el);paths.appendChild(dot);labels.appendChild(pill)
  wires.push({kind,from,to,label,tip,open,at:Date.now(),el,dot,mo,pill,d:'',rm(){el.remove();dot.remove();pill.remove()}})
  drawEdges();if(!open)setTimeout(drawEdges,TTL[kind]+80)
}
function closeWires(test){ // the hand-off ended: keep the wire a moment, then let it fade
  for(const w of wires)if(w.open&&test(w)){w.open=false;w.at=Date.now();setTimeout(drawEdges,TTL[w.kind]+80)}
}
function drawEdges(){
  const now=Date.now(),slots={},place=[]
  for(let i=wires.length-1;i>=0;i--){const w=wires[i];if(w.open&&now-w.at>3600000||!w.open&&now-w.at>TTL[w.kind]||!agents[w.from]||!agents[w.to]||w.from===w.to){w.rm();wires.splice(i,1)}}
  for(const w of wires){
    const a=box(w.from),b=box(w.to),off=n=>{slots[n]=(slots[n]||0)+1;return (slots[n]-1)*16-8}
    let pts
    if(w.from===MAIN||w.to===MAIN||Math.abs(a.x-b.x)<40&&Math.abs(a.y-b.y)>20){ // manager <-> agent, or same column: bottom/top
      const down=a.y<=b.y,x1=a.x+a.w/2+off(w.from),x2=b.x+b.w/2+off(w.to),y1=a.y+(down?a.h:0),y2=b.y+(down?0:b.h),k=Math.max(40,Math.abs(y2-y1)/2)*(down?1:-1)
      pts=[[x1,y1],[x1,y1+k],[x2,y2-k],[x2,y2]]
    }else if(Math.abs(a.y-b.y)<20){ // same row: arc beneath both cards, deeper for longer spans
      const x1=a.x+a.w/2+off(w.from),x2=b.x+b.w/2+off(w.to),y1=a.y+a.h,dip=34+22*Math.round(Math.abs(a.x-b.x)/COL);pts=[[x1,y1],[x1,y1+dip],[x2,y1+dip],[x2,y1]]
    }else{ // different row and column: side to side
      const r=b.x>a.x,x1=a.x+(r?a.w:0),y1=a.y+a.h/2+off(w.from),x2=b.x+(r?0:b.w),y2=b.y+b.h/2+off(w.to),k=(r?1:-1)*Math.max(40,Math.abs(x2-x1)/2);pts=[[x1,y1],[x1+k,y1],[x2-k,y2],[x2,y2]]
    }
    const d=`M${pts[0]} C${pts[1]} ${pts[2]} ${pts[3]}`
    if(d!==w.d){w.d=d;w.el.setAttribute('d',d);w.mo.setAttribute('path',d)}
    const mk={assign:'a',msg:'m',deliver:'d'}[w.kind],age=now-w.at,fade=w.open?1:Math.min(1,(TTL[w.kind]-age)/1200)
    w.el.setAttribute('class','wire '+w.kind);w.el.setAttribute('marker-end','url(#ah-'+mk+')')
    w.el.style.opacity=w.dot.style.opacity=w.pill.style.opacity=fade
    w.pill.className='pill '+w.kind;w.pill.textContent=w.label;w.pill.title=w.tip||''
    let mid=bez(pts,.5)
    if(w.kind==='assign')mid=[pts[3][0],pts[3][1]+(pts[3][1]>=pts[0][1]?-20:20)] // label sits right before the card the task goes to
    else if(w.kind==='deliver')mid=[pts[0][0]+70,pts[0][1]+(pts[0][1]<=pts[3][1]?20:-20)] // ...and right after the card that delivers
    place.push({w,x:mid[0],y:mid[1],pri:w.kind==='msg'?1:0})
  }
  // keep labels from overlapping: nudge down until clear
  const done=[];place.sort((p,q)=>p.pri-q.pri||p.y-q.y||p.x-q.x) // assign/deliver labels are placed first; message labels move out of their way
  for(const p of place){const pl=p.w.pill;let x=p.x,y=p.y;const wd=pl.offsetWidth+8,ht=pl.offsetHeight+6
    const hit=()=>done.some(r=>Math.abs(r.x-x)<(r.w+wd)/2&&Math.abs(r.y-y)<ht)
    for(let i=0;i<12&&p.pri&&hit();i++)x+=wd // message labels slide sideways, so they never drop onto a card
    pl.style.left=x+'px';pl.style.top=y+'px';done.push({x,y,w:wd})}
}
function select(n){selected=selected===n?null:n;for(const a of Object.values(agents))paint(a)
  for(const f of feed.children)f.classList.toggle('hid',!!selected&&!(f.dataset.a||'').split('|').includes(selected));drawEdges();dash()}
function log(e,html,kind,who=[]){
  const d=document.createElement('div');d.className='f '+kind;d.dataset.a=who.join('|')
  d.innerHTML=`<span>${new Date(e.t).toLocaleTimeString()}</span> `+html
  if(selected&&!who.includes(selected))d.classList.add('hid')
  feed.prepend(d);while(feed.children.length>300)feed.lastChild.remove()
}
function message(e,from,to){
  const text=e.message||'',tag=(text.match(/^\W*\[?([A-Za-z]+)/)||[])[1]||'',reply=/^reply$/i.test(tag),kind=reply?'reply':'ask'
  const bucket=reply?'replies':'asks'
  stats[bucket]++;(mx[from]=mx[from]||{})[to]=(mx[from][to]||0)+1;(mx[from][to+'#r']=(mx[from][to+'#r']||0)+(reply?1:0))
  get(from).sent++;get(to).recv++
  return{tag,reply,text}
}
function handle(e){
  const m=get(MAIN);lastT=e.t
  if(e.agentId&&e.agent)ids[e.agentId]=e.agent // learn id -> name from any event, so late-started monitors still resolve recipients
  if(e.event==='UserPromptSubmit'&&/^\s*</.test(e.prompt||'')){ // agent hand-backs and task notifications arrive as pseudo-prompts: not a new run
    const w=(e.prompt.match(/from="([^"]+)"/)||[])[1];log(e,'<span>update from '+esc(ids[w]||'an agent')+'</span>','',[ids[w]].filter(Boolean))
  }else if(e.event==='UserPromptSubmit'){
    resetRun();const m2=get(MAIN);stats.start=e.t
    set(m2,'running',{task:'Request: '+short(e.prompt,60),note:'Planning…',tip:e.prompt,start:e.t});log(e,'<b>You</b> → manager<q>'+esc(short(e.prompt,120))+'</q>','',[MAIN]);lastAction='waiting for the manager to plan'
  }else if(e.event==='SubagentStart'){
    const n=e.agent||'agent',a=get(n);if(e.agentId)ids[e.agentId]=n;set(a,'running',{note:'',calls:0,start:e.t,stop:0})
  }else if(e.event==='SubagentStop'){
    const n=e.agent||'agent';set(get(n),'done',{note:'',stop:e.t});closeWires(w=>w.to===n||w.from===n);wire('deliver',n,MAIN,'Delivered','');log(e,'<b>'+esc(n)+'</b> <span>finished</span>','',[n]);lastAction=n+' finished'
  }else if(e.event==='PreToolUse'){
    const from=e.actor!==undefined?res(e.actor):(e.agentId||!e.agent?res(e.agent):MAIN) // old log lines have no actor
    if(e.tool==='Agent'||e.tool==='Task'){
      const to=e.target!==undefined?res(e.target):res(e.agent),t=get(to)
      set(t,t.state,{task:e.task||e.detail||t.task,tip:e.brief||''});stats.assigned++
      wire('assign',from,to,short(e.task||e.detail||'task',34),e.brief||'',true)
      set(get(from),'running',{note:'Assigned '+to});lastAction=`${from} assigned ${to}`
      log(e,`<b>${esc(from)}</b> → <b>${esc(to)}</b><q>${esc(short(e.task||e.detail,90))}</q>`,'assign',[from,to])
    }else if(e.tool==='SendMessage'){
      const to=e.target&&e.target!=='*'&&!(/^a?[0-9a-f]{12,}$/.test(e.target)&&!ids[e.target])?res(e.target):null // unresolved raw ids are not cards
      if(to&&to!==from){
        const x=message(e,from,to);if(x.reply)closeWires(w=>w.kind==='msg'&&w.from===to&&w.to===from) // the answer closes the question
        wire('msg',from,to,(x.reply?'REPLY':(x.tag.toUpperCase()||'ASK')),x.text,!x.reply);lastAction=`${from} ${x.reply?'replied to':'asked'} ${to}`
        if(!x.reply)set(get(from),'running',{note:'Waiting on '+to})
        else set(get(from),get(from).state,{note:''})
        log(e,`<b>${esc(from)}</b> ${x.reply?'↩':'⇄'} <b>${esc(to)}</b> <span>${esc(x.tag.toUpperCase()||'MSG')}</span><q>${esc(short(x.text.replace(/^\s*\[[^\]]*\]\s*/,''),130))}</q>`,x.reply?'reply':'msg',[from,to])
      }else log(e,`<b>${esc(from)}</b> → <b>${esc(e.target||'all')}</b> <span>broadcast</span><q>${esc(short(e.message,100))}</q>`,'msg',[from])
    }else{
      const a=get(from);if(e.tool!=='SubagentHandback'){a.calls++;a.tools[e.tool]=(a.tools[e.tool]||0)+1}set(a,'running',{note:'',tip:e.tool+(e.detail?': '+e.detail:'')})
      log(e,`<b>${esc(from)}</b> <span>${esc(e.tool)} ${esc(short(e.detail,60))}</span>`,'tool',[from])
    }
  }else if(e.event==='Stop'){set(m,'done',{note:'',task:'Turn complete',stop:e.t});stats.done=true;lastAction='turn complete';log(e,'<b>Turn complete</b>','',[MAIN])}
  layout();dash()
}
/* ---------- dashboard ---------- */
function dash(){
  const all=Object.values(agents),team=all.filter(a=>a.name!==MAIN),run=team.filter(a=>a.state==='running').length,fin=team.filter(a=>a.state==='done').length
  const calls=all.reduce((s,a)=>s+a.calls,0),stale=Date.now()-lastT>120000,ref=stale?lastT:Date.now()
  const running=team.filter(a=>a.state==='running').map(a=>a.name)
  $('now').innerHTML=stats.done&&!run?`<b>Run complete</b><span>${fin} of ${team.length} agents finished · ${stats.asks+stats.replies} messages exchanged</span>`
    :`<b>${run?run+' working':'Waiting'}</b><span>${running.length?esc(short(running.join(', '),90))+' · ':''}${fin} of ${team.length} done${lastAction?' · latest: '+esc(lastAction):''}</span>`
  const tile=(c,l,v)=>`<div class="tile ${c}"><em>${l}</em><b>${v}</b></div>`
  $('tiles').innerHTML=tile('run','Working now',run)+tile('done','Finished',fin+'<small style="font-size:12px;color:var(--mut)"> / '+team.length+'</small>')+tile('','Tasks assigned',stats.assigned)+tile('','Tool calls',calls)+tile('msg','Requests',stats.asks)+tile('msg','Replies',stats.replies)+tile('','Elapsed',stats.start?fmt((stats.done?(agents[MAIN].stop||lastT):ref)-stats.start):'–')
  const maxCalls=Math.max(1,...all.map(a=>a.calls))
  const rows=[...all].sort((a,b)=>(a.state==='running'?-1:1)-(b.state==='running'?-1:1)||rank(a.name)-rank(b.name))
  $('tbl').innerHTML='<tr><th>Agent</th><th>Status</th><th>Assignment</th><th>Time</th><th>Tool calls</th><th>Msgs ↑ ↓</th><th>Mostly</th></tr>'+rows.map(a=>{
    const top=Object.entries(a.tools).sort((x,y)=>y[1]-x[1]).slice(0,2).map(([k,v])=>k+' ×'+v).join(', ')
    const dur=a.start?fmt((a.stop||(a.state==='running'?ref:a.start))-a.start):'–'
    return `<tr class="row ${a.state}${selected===a.name?' sel':''}" data-n="${esc(a.name)}"><td class=nm><i></i>${esc(a.name)}</td><td>${{idle:'Idle',running:'Working',done:'Done'}[a.state]}</td><td class=tk title="${esc(a.task)}">${esc(a.task||'–')}</td><td class=num>${dur}</td><td class=num><span class=bar style="width:${Math.round(a.calls/maxCalls*50)}px"></span>${a.calls}</td><td class=num>${a.sent} / ${a.recv}</td><td class=tools>${esc(top||'–')}</td></tr>`}).join('')
  for(const tr of $('tbl').querySelectorAll('tr.row'))tr.onclick=()=>select(tr.dataset.n)
  const names=Object.keys(agents).filter(n=>mx[n]||Object.values(mx).some(r=>r[n])).sort((a,b)=>rank(a)-rank(b))
  if(!names.length){$('mx').innerHTML='<div class=hint>No agent messages yet. When an agent asks another for help, it shows up here.</div>';return}
  const cell=(f,t)=>{const n=(mx[f]||{})[t]||0,r=(mx[f]||{})[t+'#r']||0;if(!n)return '<td></td>';return `<td style="background:rgba(245,184,75,${Math.min(.15+n*.12,.6)})" title="${n-r} requests, ${r} replies">${n-r?n-r:''}${r?(n-r?' · ':'')+'↩'+r:''}</td>`}
  $('mx').innerHTML='<table class=mx><tr><th></th>'+names.map(n=>`<th title="${esc(n)}">${esc(short(n.replace('portfolio-',''),11))}</th>`).join('')+'</tr>'+names.map(f=>`<tr><td>${esc(f)}</td>${names.map(t=>f===t?'<td style="color:#333">–</td>':cell(f,t)).join('')}</tr>`).join('')+'</table><div class=hint style="margin-top:6px">number = requests sent · ↩ = replies</div>'
}
get(MAIN);ORDER.forEach(get);resetRun();layout();dash();addEventListener('resize',layout);setInterval(()=>{drawEdges();dash()},400) // links fade and timers tick
if(!window.__STATIC){const es=new EventSource('/stream');es.onopen=()=>conn.textContent='● live';es.onerror=()=>conn.textContent='○ reconnecting…'
es.onmessage=ev=>handle(JSON.parse(ev.data))}
</script>
